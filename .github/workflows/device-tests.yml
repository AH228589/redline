# Background recording tests on a simulated iPhone and an Android emulator.
# Run by hand from the Actions tab (or the API) after changing recording code.
name: Device tests

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which device to test
        type: choice
        options: [both, ios, android]
        default: both
      quick:
        description: Quick check (map and workers only, no background run)
        type: boolean
        default: false
      ios_web:
        description: Where the iPhone app loads its web layer from
        type: choice
        options: [server, bundled]
        default: bundled
      probe:
        description: Only run the minimal worker probe page inside the app
        type: boolean
        default: false

env:
  VITE_AUTOTEST: '1'
  VITE_AUTOTEST_SECONDS: '240'
  VITE_AUTOTEST_QUICK: ${{ inputs.quick && '1' || '0' }}
  VITE_AUTOTEST_PROBE: ${{ inputs.probe && '1' || '0' }}

jobs:
  ios:
    if: inputs.platform != 'android'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use the newest Xcode on the runner
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - run: npm ci
      - run: rm -f public/redline.apk public/redline.ipa
      - run: npm run build
      # Like the release app, load the web layer over http(s), here from a local server
      # with the autotest build, and let the app reach it.
      - name: Serve the test build
        run: |
          nohup npx vite preview --host localhost --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          curl -sI http://localhost:4173/ | head -1
      - run: npx cap sync ios
        env:
          CAP_SERVER_URL: ${{ inputs.ios_web == 'server' && 'http://localhost:4173' || '' }}
      - name: Allow the local test server in the app
        run: |
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$P"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$P"
      - name: Pick an iPhone simulator
        run: |
          # Newest iOS runtime, then the newest iPhone in it.
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, re, sys
          d = json.load(sys.stdin)['devices']
          ver = lambda k: [int(x) for x in re.findall(r'(\d+)', k.split('iOS-')[-1])]
          rt = sorted([k for k in d if 'iOS' in k and any(x['name'].startswith('iPhone') for x in d[k])], key=ver)[-1]
          phones = [x for x in d[rt] if x['name'].startswith('iPhone')]
          print(phones[-1]['udid']); print(rt, phones[-1]['name'], file=sys.stderr)")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
      - name: Build for the simulator
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -destination "id=$UDID" -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build
      - name: Background recording test
        run: bash .github/scripts/ios-sim-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-results
          path: out/

  android:
    if: inputs.platform != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: npm ci
      - run: rm -f public/redline.apk public/redline.ipa
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Background recording test (screen locked)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          script: bash .github/scripts/android-emu-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-results
          path: out/
