# Background recording tests on a simulated iPhone and an Android emulator.
# Run by hand from the Actions tab (or the API) after changing recording code.
name: Device tests

on:
  workflow_dispatch:

env:
  VITE_AUTOTEST: '1'
  VITE_AUTOTEST_SECONDS: '240'

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use the newest Xcode on the runner
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - run: npm ci
      - run: rm -f public/redline.apk public/redline.ipa
      - run: npm run build
      - run: npx cap sync ios
      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]; print(c[-1]['udid']); print(c[-1]['name'], file=sys.stderr)")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
      - name: Build for the simulator
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -destination "id=$UDID" -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build
      - name: Background recording test
        run: bash .github/scripts/ios-sim-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-results
          path: out/

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: npm ci
      - run: rm -f public/redline.apk public/redline.ipa
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Background recording test (screen locked)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/android-emu-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-results
          path: out/
